<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202126">
  <title>Нет подключения · folio</title>
  <style>
    :root{color-scheme:light;--ink:#202126;--muted:#6f716f;--paper:#f5f5f3;--accent:#d7fa58}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI",sans-serif}
    .box{width:min(100%,460px);padding:clamp(24px,7vw,36px);background:#fff;border:1px solid #e7e7e4;border-radius:20px;box-shadow:0 16px 48px #2021260a}
    .mark{width:44px;height:44px;display:grid;place-items:center;background:var(--accent);border-radius:13px;font-weight:800}
    h1{margin:20px 0 10px;font-size:clamp(23px,6vw,28px);line-height:1.2;letter-spacing:-.03em}
    p{margin:0 0 24px;color:var(--muted)}
    .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:0;border-radius:9px;background:var(--accent);color:var(--ink);font:700 15px/1.3 "Segoe UI",sans-serif;text-decoration:none}
    .button:hover{background:#c8ef43}
    .button:focus-visible{outline:3px solid #718d1d;outline-offset:3px}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true">f.</div>
    <h1>Нет соединения</h1>
    <p>Эта страница не сохранена для офлайн-доступа. Вернитесь в портфолио, чтобы продолжить работу с кейсами, сохранёнными на устройстве.</p>
    <a class="button" id="portfolio-link" href="./">Открыть портфолио</a>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(registration => {
        if (registration) document.getElementById('portfolio-link').href = registration.scope;
      }).catch(() => {});
    }
  </script>
</body>
</html>
